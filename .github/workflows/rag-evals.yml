name: RAG evals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-evals
    env:
      # CI runs the deterministic suite only: no API key, no cost, no flakiness.
      EVAL_MODE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Regression evals (fails the PR if a threshold is not met)
        run: python scripts/regression.py
